name: Tarea implementable
description: Definí un contrato de tarea ejecutable y acotado para Ranquel Tech Lab.
title: "[TAREA] "
labels:
  - codex-ready
  - needs-evidence
body:
  - type: markdown
    attributes:
      value: |
        No incluyas secretos ni datos personales. La verdad del repositorio, la
        issue actual, `AGENTS.md` y `docs/truth/**` prevalecen sobre el contexto
        de conversaciones anteriores. Construí el inventario Sxx y la
        clasificación D01–D12 a partir de la
        [matriz interdisciplinaria canónica](https://github.com/cabaniasriocuarto/RanquelTechLab/blob/main/docs/truth/INTERDISCIPLINARY_REVIEW_MATRIX.md).

  - type: input
    id: parent_issue
    attributes:
      label: Issue padre
      description: "Usá una referencia a una issue, por ejemplo #2, o explicá por qué no hay una issue padre."
      placeholder: "#2"
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: Hito
      description: Usá el nombre exacto del hito M0–M4.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencias y bloqueos
      description: Listá las referencias a issues y el orden requerido.
      placeholder: "Depende de #N. Bloquea #M."
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: Indicá el resultado observable, no sólo la idea de implementación.
    validations:
      required: true

  - type: textarea
    id: baseline
    attributes:
      label: Baseline observado
      description: Registrá por separado el comportamiento actual del repositorio y las incógnitas externas.
    validations:
      required: true

  - type: textarea
    id: allowed_paths
    attributes:
      label: Rutas y símbolos permitidos
      description: Usá la lista explícita de rutas permitidas más acotada que permita completar la tarea.
      render: text
    validations:
      required: true

  - type: textarea
    id: forbidden_paths
    attributes:
      label: Rutas prohibidas
      description: Incluí las superficies sensibles y adyacentes que deben permanecer sin cambios.
      render: text
    validations:
      required: true

  - type: textarea
    id: external_systems
    attributes:
      label: Sistemas externos
      description: Separá las operaciones de lectura/escritura permitidas de las mutaciones prohibidas.
      placeholder: |
        Permitido:
        Prohibido:
    validations:
      required: true

  - type: textarea
    id: preserved_contracts
    attributes:
      label: Contratos que deben preservarse
      description: Incluí invariantes de rutas, datos, SEO, privacidad, analítica, API o release.
    validations:
      required: true

  - type: textarea
    id: changed_surfaces
    attributes:
      label: Inventario de superficies modificadas
      description: Listá cada efecto con un ID Sxx y cada fila exacta aplicable de la matriz; listá por separado los responsables de dominio porque no pueden reemplazar las filas de la matriz.
      placeholder: |
        S01 — efecto — rutas/símbolos/sistemas — fila(s) exacta(s) de la matriz — responsable(s) de dominio
        S02 — efecto — rutas/símbolos/sistemas — fila(s) exacta(s) de la matriz — responsable(s) de dominio
    validations:
      required: true

  - type: textarea
    id: interdisciplinary_classification
    attributes:
      label: Clasificación interdisciplinaria D01–D12
      description: Clasificá cada disciplina como MATERIAL o NOT_APPLICABLE con criterio, evidencia, persona revisora y condición STOP.
      placeholder: |
        D01 — MATERIAL — superficie — contrato/criterio — evidencia — persona revisora — STOP
        D02 — NOT_APPLICABLE — motivo concreto
        Continuá hasta D12.
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Riesgo
      options:
        - LIGHT
        - STANDARD
        - HIGH
        - CRITICAL
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Para una superficie SEO/indexable, completá los campos Golden SEO
        siguientes. En caso contrario, seleccioná o ingresá NOT_APPLICABLE y
        justificá esa clasificación.

  - type: input
    id: seoArchetype
    attributes:
      label: seoArchetype
      description: "Usá el arquetipo aprobado en #26 o NOT_APPLICABLE con un motivo."
      placeholder: "NOT_APPLICABLE — sin superficie SEO/indexable"
    validations:
      required: true

  - type: input
    id: goldenBaselineVersion
    attributes:
      label: goldenBaselineVersion
      description: Usá la versión de baseline aprobada, NOT_AVAILABLE o NOT_APPLICABLE con un motivo.
      placeholder: "NOT_APPLICABLE — sin superficie SEO/indexable"
    validations:
      required: true

  - type: dropdown
    id: SEO_GOLDEN_PARITY
    attributes:
      label: SEO_GOLDEN_PARITY
      options:
        - PASS
        - FAIL
        - BLOCKED
        - PARTIAL
        - NOT_RUN
        - UNKNOWN
        - AUTH_BLOCKED
        - PREVIEW_BLOCKED
        - CAPABILITY_GAP
        - NOT_APPLICABLE
    validations:
      required: true

  - type: dropdown
    id: HOME_SEO_REGRESSION
    attributes:
      label: HOME_SEO_REGRESSION
      options:
        - PASS
        - FAIL
        - BLOCKED
        - PARTIAL
        - NOT_RUN
        - UNKNOWN
        - AUTH_BLOCKED
        - PREVIEW_BLOCKED
        - CAPABILITY_GAP
        - NOT_APPLICABLE
    validations:
      required: true

  - type: dropdown
    id: LOCAL_CONTENT_UTILITY
    attributes:
      label: LOCAL_CONTENT_UTILITY
      options:
        - PASS
        - FAIL
        - BLOCKED
        - PARTIAL
        - NOT_RUN
        - UNKNOWN
        - AUTH_BLOCKED
        - PREVIEW_BLOCKED
        - CAPABILITY_GAP
        - NOT_APPLICABLE
    validations:
      required: true

  - type: dropdown
    id: MOBILE_SEO_PARITY
    attributes:
      label: MOBILE_SEO_PARITY
      options:
        - PASS
        - FAIL
        - BLOCKED
        - PARTIAL
        - NOT_RUN
        - UNKNOWN
        - AUTH_BLOCKED
        - PREVIEW_BLOCKED
        - CAPABILITY_GAP
        - NOT_APPLICABLE
    validations:
      required: true

  - type: dropdown
    id: MULTILINGUAL_SEO
    attributes:
      label: MULTILINGUAL_SEO
      description: La interfaz de idioma existente del lado del cliente no demuestra la paridad SEO multilingüe.
      options:
        - PASS
        - FAIL
        - BLOCKED
        - PARTIAL
        - NOT_RUN
        - UNKNOWN
        - AUTH_BLOCKED
        - PREVIEW_BLOCKED
        - CAPABILITY_GAP
        - NOT_APPLICABLE
    validations:
      required: true

  - type: textarea
    id: tests_gates
    attributes:
      label: Pruebas y controles
      description: Listá las pruebas focales, los controles de regresión, los criterios de aprobación por superficie, las necesidades del HEAD exacto y la solicitud independiente obligatoria.
    validations:
      required: true

  - type: textarea
    id: visual_validation
    attributes:
      label: Validación visual
      description: Definí la cobertura para escritorio y móvil o justificá NOT_APPLICABLE.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidencia requerida
      description: Definí comandos, artefactos, SHAs, vistas previas, registros, estados honestos y evidencia de la auditoría independiente.
    validations:
      required: true

  - type: textarea
    id: stop_conditions
    attributes:
      label: Condiciones STOP
      description: Listá los eventos que exigen detenerse en lugar de ampliar el alcance.
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definición de terminado
      description: "Incluí merge, aceptación post-merge, reconciliación de verdad y cierre humano explícito de la issue; los PR usan la referencia no autocerrante Refs #N."
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Flujo bajo gobierno humano
      options:
        - label: No incluí secretos, tokens, credenciales ni datos personales.
          required: true
        - label: "INDEPENDENT_REVIEW_REQUEST=REQUIRED: todo Draft PR implementable solicitará auditoría independiente; la falta de capacidad o autorización bloquea el avance y no equivale a PASS."
          required: true
        - label: Marcar el PR como Ready, hacer merge, cerrar explícitamente la issue, desplegar, publicar, ejecutar campañas y autorizar gasto siguen siendo decisiones humanas.
          required: true
